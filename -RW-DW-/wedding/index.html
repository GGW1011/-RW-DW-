<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#514c3b">
  <title>Wedding — Sherry &amp; Dean</title>

  <link rel="stylesheet" href="https://use.typekit.net/mpq4daa.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body class="wedding-page" id="top">
  <header class="wedding-header">
    <a class="wedding-back" href="../index.html">← 返回首页</a>
    <a class="wedding-wordmark" href="../index.html">
      Sherry <span>&amp;</span> Dean
    </a>
  </header>

  <main class="wedding-main">
    <section class="propose-section">
      <p class="wedding-eyebrow">THE DAY I SAID YES</I></p>
      <h1>求婚那天</h1>

      <figure class="propose-frame">
        <img
          src="../assets/images/wedding/propose.jpg"
          alt="我们求婚时的照片"
        >
      </figure>
    </section>

    <section class="dress-section" aria-labelledby="dress-heading">
      <div class="dress-heading">
        <p class="wedding-eyebrow">A LITTLE ALBUM</p>
        <h2 id="dress-heading">试纱照片</h2>
      </div>

      <div class="album" aria-label="试纱照片图册">
        <button
          class="album-arrow album-arrow--previous"
          id="previous-photo"
          type="button"
          aria-label="上一张"
        >←</button>

        <figure class="album-frame" id="album-frame">
          <img
            id="album-photo"
            src="../assets/images/wedding/01.jpg"
            alt="试纱照片 1"
          >
        </figure>

        <button
          class="album-arrow album-arrow--next"
          id="next-photo"
          type="button"
          aria-label="下一张"
        >→</button>

        <p class="album-counter" id="album-counter" aria-live="polite">
          01 / 15
        </p>
      </div>
    </section>
  </main>

  <footer class="wedding-footer">
    <a href="#top">回到顶部 ↑</a>
  </footer>
</body>
</html>
